<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#21262d" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="320" rx="14" fill="url(#bg)"/>
  <rect width="900" height="320" rx="14" fill="url(#grid)" opacity="0.5"/>
  <rect x="1" y="1" width="898" height="318" rx="13" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- window chrome -->
  <rect x="0" y="0" width="900" height="36" rx="14" fill="#161b22"/>
  <rect x="0" y="22" width="900" height="14" fill="#161b22"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="18" r="6" fill="#27c93f"/>
  <text x="450" y="23" font-family="SFMono-Regular, Consolas, monospace" font-size="12" fill="#8b949e" text-anchor="middle">harshith@dev:~</text>
  <line x1="0" y1="36" x2="900" y2="36" stroke="#30363d" stroke-width="1"/>

  <!-- terminal body -->
  <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="17">
    <text x="36" y="80" fill="#3fb950">$</text>
    <text x="56" y="80" fill="#c9d1d9">whoami</text>

    <text x="36" y="112" fill="url(#accent)" font-size="28" font-weight="700">Harshith Ghanashyam</text>

    <text x="36" y="146" fill="#3fb950">$</text>
    <text x="56" y="146" fill="#c9d1d9">cat focus.txt</text>
    <text x="36" y="176" fill="#8b949e">Backend systems, clean architecture, and intelligent</text>
    <text x="36" y="198" fill="#8b949e">software — from production APIs to RAG pipelines,</text>
    <text x="36" y="220" fill="#8b949e">agents, and reinforcement learning.</text>

    <text x="36" y="256" fill="#3fb950">$</text>
    <text x="56" y="256" fill="#c9d1d9">./run --flagship memops</text>
    <text x="36" y="284" fill="#d29922">→ operational memory infrastructure for AI systems</text>

    <rect x="36" y="296" width="10" height="18" fill="#58a6ff">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
