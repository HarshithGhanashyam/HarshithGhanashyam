<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      /* Background Particles */
      .bg-particle {
        animation: floatParticle 8s infinite linear;
      }
      .bg-particle:nth-child(even) {
        animation-duration: 12s;
        animation-direction: reverse;
      }
      .bg-particle:nth-child(3n) {
        animation-duration: 10s;
        animation-delay: 2s;
      }
      @keyframes floatParticle {
        0% { transform: translate(0, 0); opacity: 0.1; }
        50% { transform: translate(20px, -20px); opacity: 0.5; }
        100% { transform: translate(0, 0); opacity: 0.1; }
      }

      /* VISION (Left) */
      .pulse-ring {
        fill: none;
        stroke: #00D4FF;
        stroke-width: 1.5;
        transform-origin: center;
        animation: pulse 4s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
      }
      .pulse-ring:nth-child(1) { animation-delay: 0s; }
      .pulse-ring:nth-child(2) { animation-delay: 1.33s; }
      .pulse-ring:nth-child(3) { animation-delay: 2.66s; }
      @keyframes pulse {
        0% { transform: scale(0.3); opacity: 0; }
        30% { opacity: 0.6; }
        100% { transform: scale(2); opacity: 0; }
      }
      
      .scan-line {
        stroke: #00D4FF;
        stroke-width: 2;
        opacity: 0.4;
        animation: scan 4s infinite linear;
      }
      @keyframes scan {
        0% { transform: translateY(-80px); opacity: 0; }
        10% { opacity: 0.5; }
        90% { opacity: 0.5; }
        100% { transform: translateY(80px); opacity: 0; }
      }

      /* INTELLIGENCE (Center) */
      .node {
        fill: #A855F7;
        animation: nodeGlow 3s infinite alternate;
      }
      .node:nth-child(odd) { animation-delay: 1.5s; animation-duration: 4s; }
      .link {
        stroke: #A855F7;
        stroke-width: 1.5;
        opacity: 0.2;
        animation: linkPulse 3s infinite alternate;
      }
      .link:nth-child(even) { animation-delay: 1s; }
      @keyframes nodeGlow {
        0% { opacity: 0.3; r: 3; }
        100% { opacity: 0.8; r: 5; filter: drop-shadow(0 0 4px #A855F7); }
      }
      @keyframes linkPulse {
        0% { opacity: 0.1; }
        100% { opacity: 0.4; }
      }

      /* SYSTEMS (Right) */
      .circuit-path {
        fill: none;
        stroke: #F59E0B;
        stroke-width: 1.5;
        stroke-dasharray: 10, 10;
        animation: dash 4s infinite linear;
        opacity: 0.6;
      }
      .circuit-path:nth-child(2n) { animation-direction: reverse; animation-duration: 6s; }
      @keyframes dash {
        to { stroke-dashoffset: -40; }
      }

      .grid-dot {
        fill: #F59E0B;
        opacity: 0.3;
        animation: blink 4s infinite;
      }
      .grid-dot:nth-child(odd) { animation-delay: 2s; }
      @keyframes blink {
        0%, 100% { opacity: 0.1; }
        50% { opacity: 0.7; }
      }

      /* Typography */
      .title {
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 46px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: 12px;
        text-anchor: middle;
        text-shadow: 0px 4px 20px rgba(0,0,0,0.5);
      }
      .subtitle {
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 16px;
        font-weight: 600;
        fill: #a1a1aa;
        letter-spacing: 6px;
        text-anchor: middle;
      }
      .tagline {
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 18px;
        font-weight: 400;
        fill: #e2e8f0;
        text-anchor: middle;
        opacity: 0.8;
      }
    </style>
    
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="line-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" />

  <!-- Particles Background -->
  <g id="particles" fill="#ffffff">
    <circle cx="150" cy="50" r="1" class="bg-particle" />
    <circle cx="350" cy="120" r="1.5" class="bg-particle" />
    <circle cx="550" cy="80" r="1" class="bg-particle" />
    <circle cx="750" cy="150" r="2" class="bg-particle" />
    <circle cx="950" cy="60" r="1" class="bg-particle" />
    <circle cx="1150" cy="110" r="1.5" class="bg-particle" />
    <circle cx="100" cy="250" r="1" class="bg-particle" />
    <circle cx="300" cy="350" r="1.5" class="bg-particle" />
    <circle cx="500" cy="300" r="1" class="bg-particle" />
    <circle cx="700" cy="380" r="1" class="bg-particle" />
    <circle cx="900" cy="280" r="2" class="bg-particle" />
    <circle cx="1100" cy="320" r="1.5" class="bg-particle" />
  </g>

  <!-- Left: VISION (#00D4FF) -->
  <g transform="translate(200, 200)">
    <circle cx="0" cy="0" r="60" class="pulse-ring" />
    <circle cx="0" cy="0" r="60" class="pulse-ring" />
    <circle cx="0" cy="0" r="60" class="pulse-ring" />
    
    <!-- Reticle -->
    <path d="M-20,-80 L-40,-80 L-40,-60 M40,-80 L20,-80 L40,-80 L40,-60 M-40,60 L-40,80 L-20,80 M40,60 L40,80 L20,80" fill="none" stroke="#00D4FF" stroke-width="1.5" opacity="0.5" />
    <line x1="-60" y1="0" x2="60" y2="0" class="scan-line" />
    
    <!-- Central eye/lens core -->
    <circle cx="0" cy="0" r="12" fill="none" stroke="#00D4FF" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="0" r="3" fill="#00D4FF" opacity="0.8"/>
  </g>

  <!-- Center: INTELLIGENCE (#A855F7) -->
  <g transform="translate(600, 200)">
    <!-- Nodes -->
    <circle cx="-160" cy="-60" r="4" class="node" />
    <circle cx="-80" cy="-110" r="4" class="node" />
    <circle cx="0" cy="-130" r="4" class="node" />
    <circle cx="80" cy="-110" r="4" class="node" />
    <circle cx="160" cy="-60" r="4" class="node" />
    
    <circle cx="-200" cy="0" r="4" class="node" />
    <circle cx="200" cy="0" r="4" class="node" />
    
    <circle cx="-160" cy="80" r="4" class="node" />
    <circle cx="-80" cy="130" r="4" class="node" />
    <circle cx="0" cy="150" r="4" class="node" />
    <circle cx="80" cy="130" r="4" class="node" />
    <circle cx="160" cy="80" r="4" class="node" />
    
    <!-- Perimeter Links -->
    <line x1="-160" y1="-60" x2="-80" y2="-110" class="link" />
    <line x1="-80" y1="-110" x2="0" y2="-130" class="link" />
    <line x1="0" y1="-130" x2="80" y2="-110" class="link" />
    <line x1="80" y1="-110" x2="160" y2="-60" class="link" />
    
    <line x1="-200" y1="0" x2="-160" y2="-60" class="link" />
    <line x1="200" y1="0" x2="160" y2="-60" class="link" />
    
    <line x1="-200" y1="0" x2="-160" y2="80" class="link" />
    <line x1="-160" y1="80" x2="-80" y2="130" class="link" />
    <line x1="-80" y1="130" x2="0" y2="150" class="link" />
    <line x1="0" y1="150" x2="80" y2="130" class="link" />
    <line x1="80" y1="130" x2="160" y2="80" class="link" />
    <line x1="160" y1="80" x2="200" y2="0" class="link" />
    
    <!-- Cross Links (subtle) -->
    <line x1="-160" y1="-60" x2="-80" y2="130" class="link" opacity="0.1"/>
    <line x1="160" y1="-60" x2="80" y2="130" class="link" opacity="0.1"/>
    <line x1="-80" y1="-110" x2="80" y2="-110" class="link" opacity="0.15"/>
    <line x1="-80" y1="130" x2="80" y2="130" class="link" opacity="0.15"/>
  </g>

  <!-- Right: SYSTEMS (#F59E0B) -->
  <g transform="translate(1000, 200)">
    <!-- Grid Base -->
    <circle cx="-50" cy="-50" r="1.5" class="grid-dot" />
    <circle cx="0" cy="-50" r="1.5" class="grid-dot" />
    <circle cx="50" cy="-50" r="1.5" class="grid-dot" />
    <circle cx="-50" cy="0" r="1.5" class="grid-dot" />
    <circle cx="0" cy="0" r="1.5" class="grid-dot" />
    <circle cx="50" cy="0" r="1.5" class="grid-dot" />
    <circle cx="-50" cy="50" r="1.5" class="grid-dot" />
    <circle cx="0" cy="50" r="1.5" class="grid-dot" />
    <circle cx="50" cy="50" r="1.5" class="grid-dot" />
    
    <!-- Circuit lines -->
    <path d="M-80,-25 L-25,-25 L0,-50 L80,-50" class="circuit-path" />
    <path d="M-80,25 L-25,25 L0,50 L80,50" class="circuit-path" />
    <path d="M-50,80 L-50,25 L-25,0 L25,0 L50,-25 L50,-80" class="circuit-path" />
    
    <!-- End points / Chips -->
    <rect x="76" y="-53" width="6" height="6" fill="#F59E0B" opacity="0.7"/>
    <rect x="76" y="47" width="6" height="6" fill="#F59E0B" opacity="0.7"/>
    <rect x="47" y="-83" width="6" height="6" fill="#F59E0B" opacity="0.7"/>
    <circle cx="0" cy="0" r="4" fill="#F59E0B" opacity="0.8" />
  </g>

  <!-- Text Content (Centered, prominent over animations) -->
  <g transform="translate(600, 210)">
    <text y="-25" class="title">HARSHITH GHANASHYAM</text>
    
    <text y="20" class="subtitle">
      <tspan fill="#00D4FF">VISION</tspan>
      <tspan fill="#4b5563">  &#215;  </tspan>
      <tspan fill="#A855F7">INTELLIGENCE</tspan>
      <tspan fill="#4b5563">  &#215;  </tspan>
      <tspan fill="#F59E0B">SYSTEMS</tspan>
    </text>
    
    <text y="65" class="tagline">Building AI systems that see, reason, and act.</text>
  </g>

  <!-- Bottom Gradient Line -->
  <rect x="0" y="396" width="1200" height="4" fill="url(#line-grad)" />
</svg>
