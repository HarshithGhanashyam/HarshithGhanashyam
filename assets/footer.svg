<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#0a0a1a" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    
    <style>
      .particle {
        fill: #ffffff;
      }
      .p1 { animation: float1 9s infinite ease-in-out; }
      .p2 { animation: float2 11s infinite ease-in-out; }
      .p3 { animation: float3 10s infinite ease-in-out; }

      @keyframes float1 {
        0%, 100% { transform: translateY(0px); opacity: 0.1; }
        50% { transform: translateY(-12px); opacity: 0.35; }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(-8px) translateX(10px); opacity: 0.45; }
      }
      @keyframes float3 {
        0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.15; }
        50% { transform: translateY(10px) translateX(-6px); opacity: 0.4; }
      }

      .text-main {
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 16px;
        font-weight: 600;
        fill: #8B949E;
        text-anchor: middle;
        letter-spacing: 3px;
      }
      
      .text-sub {
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 11px;
        font-weight: 400;
        fill: #6e7681;
        text-anchor: middle;
        letter-spacing: 1px;
        opacity: 0.8;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="120" fill="url(#bgGrad)" />

  <!-- Top Line (mirrors bottom line of header) -->
  <rect width="1200" height="2" fill="url(#lineGrad)" />

  <!-- Subtle Floating Particles -->
  <!-- Left Side -->
  <circle cx="80" cy="85" r="1.5" class="particle p1" />
  <circle cx="150" cy="35" r="2" class="particle p2" />
  <circle cx="280" cy="95" r="1.2" class="particle p3" />
  <circle cx="360" cy="40" r="1" class="particle p1" />
  <circle cx="480" cy="70" r="1.5" class="particle p2" />

  <!-- Right Side -->
  <circle cx="1120" cy="85" r="1.5" class="particle p2" />
  <circle cx="1050" cy="35" r="2" class="particle p1" />
  <circle cx="920" cy="95" r="1.2" class="particle p3" />
  <circle cx="840" cy="40" r="1" class="particle p2" />
  <circle cx="720" cy="70" r="1.5" class="particle p1" />
  
  <!-- Center Scattered -->
  <circle cx="550" cy="25" r="1" class="particle p3" />
  <circle cx="650" cy="20" r="1.2" class="particle p1" />
  <circle cx="580" cy="105" r="1.5" class="particle p2" />
  <circle cx="620" cy="110" r="1" class="particle p3" />

  <!-- Typography -->
  <text x="600" y="62" class="text-main">👁️ SEE · 🧠 THINK · ⚙️ BUILD</text>
  <text x="600" y="92" class="text-sub">© 2024 Harshith Ghanashyam · Building AI systems that see, reason, and act.</text>
</svg>
