<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <style>
      @keyframes flow { 0% { stroke-dashoffset: 24; } 100% { stroke-dashoffset: 0; } }
      @keyframes flow-reverse { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 24; } }
      .bg { fill: #0d1117; }
      .header { fill: #8B949E; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 2px; }
      .node { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 6; }
      .text { fill: #E6EDF3; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 500; text-anchor: middle; dominant-baseline: middle; }
      .path-line { stroke: #30363d; stroke-width: 2; fill: none; }
      .particle-line { stroke: #A855F7; stroke-width: 2; stroke-dasharray: 4, 12; stroke-linecap: round; animation: flow 1s linear infinite; fill: none; }
      .particle-loop { stroke: #A855F7; stroke-width: 2; stroke-dasharray: 4, 12; stroke-linecap: round; animation: flow-reverse 1.5s linear infinite; fill: none; }
      .accent { fill: #A855F7; }
    </style>
  </defs>
  
  <rect width="100%" height="100%" class="bg" />
  <text x="30" y="30" class="header">AUTONOMOUS RESEARCH AGENT</text>
  
  <!-- Paths -->
  <path d="M 140 100 L 190 100" class="path-line" />
  <path d="M 140 100 L 190 100" class="particle-line" />
  
  <path d="M 310 100 L 360 100" class="path-line" />
  <path d="M 310 100 L 360 100" class="particle-line" />
  
  <path d="M 480 100 L 530 100" class="path-line" />
  <path d="M 480 100 L 530 100" class="particle-line" />
  
  <path d="M 670 100 L 720 100" class="path-line" />
  <path d="M 670 100 L 720 100" class="particle-line" />
  
  <!-- Loop Path -->
  <path d="M 600 120 C 600 180, 250 180, 250 120" class="path-line" />
  <path d="M 600 120 C 600 180, 250 180, 250 120" class="particle-loop" />
  
  <!-- Nodes -->
  <rect x="40" y="80" width="100" height="40" class="node" />
  <rect x="40" y="80" width="4" height="40" class="accent" rx="2" />
  <text x="90" y="101" class="text">INPUT</text>
  
  <rect x="190" y="80" width="120" height="40" class="node" />
  <rect x="190" y="80" width="4" height="40" class="accent" rx="2" />
  <text x="250" y="101" class="text">REASON</text>
  
  <rect x="360" y="80" width="120" height="40" class="node" />
  <rect x="360" y="80" width="4" height="40" class="accent" rx="2" />
  <text x="420" y="101" class="text">TOOL</text>
  
  <rect x="530" y="80" width="140" height="40" class="node" />
  <rect x="530" y="80" width="4" height="40" class="accent" rx="2" />
  <text x="600" y="101" class="text">OBSERVATION</text>
  
  <rect x="720" y="80" width="100" height="40" class="node" />
  <rect x="720" y="80" width="4" height="40" class="accent" rx="2" />
  <text x="770" y="101" class="text">ANSWER</text>
</svg>
