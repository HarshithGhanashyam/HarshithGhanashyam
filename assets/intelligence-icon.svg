<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%">
  <style>
    .node {
      fill: #A855F7;
    }
    .connection {
      fill: none;
      stroke: #A855F7;
      stroke-width: 1.5;
      stroke-linecap: round;
    }
    .pulse-light {
      fill: #FFF;
      opacity: 0;
      animation: node-flash 3s infinite ease-in-out;
    }
    .c1 { animation-delay: 0s; }
    .c2 { animation-delay: 0.6s; }
    .c3 { animation-delay: 1.2s; }
    .c4 { animation-delay: 1.8s; }
    .c5 { animation-delay: 2.4s; }
    
    @keyframes node-flash {
      0%, 100% { opacity: 0; r: 2; }
      50% { opacity: 0.9; r: 4; filter: drop-shadow(0 0 4px #A855F7); }
    }
  </style>
  <g transform="translate(40,40)">
    <path class="connection" d="M0,-20 L15,-5 L10,15 L-10,15 L-15,-5 Z" />
    <path class="connection" d="M0,-20 L0,0 L15,-5 M0,0 L10,15 M0,0 L-10,15 M0,0 L-15,-5" />
    <path class="connection" d="M-15,-5 L-25,-15 M0,-20 L-5,-30 M15,-5 L25,-10 M10,15 L15,25 M-10,15 L-20,20" />
    
    <circle class="node" cx="0" cy="-20" r="3" />
    <circle class="node" cx="15" cy="-5" r="3" />
    <circle class="node" cx="10" cy="15" r="3" />
    <circle class="node" cx="-10" cy="15" r="3" />
    <circle class="node" cx="-15" cy="-5" r="3" />
    <circle class="node" cx="0" cy="0" r="4.5" />
    
    <circle class="pulse-light c1" cx="0" cy="-20" r="3" />
    <circle class="pulse-light c2" cx="15" cy="-5" r="3" />
    <circle class="pulse-light c3" cx="10" cy="15" r="3" />
    <circle class="pulse-light c4" cx="-10" cy="15" r="3" />
    <circle class="pulse-light c5" cx="-15" cy="-5" r="3" />
    <circle class="pulse-light c1" cx="0" cy="0" r="4.5" />
  </g>
</svg>
