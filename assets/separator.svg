<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 4" width="100%" height="4">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    .line {
      animation: pulse 3s infinite alternate ease-in-out;
    }
    @keyframes pulse {
      0% { opacity: 0.6; filter: drop-shadow(0 0 1px rgba(168,85,247,0.5)); }
      100% { opacity: 1; filter: drop-shadow(0 0 3px rgba(168,85,247,0.9)); }
    }
  </style>
  <rect class="line" x="0" y="1" width="1200" height="2" fill="url(#gradient)" rx="1" filter="url(#glow)"/>
</svg>
